<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Galería — vista previa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); }
  .pared { background: var(--fondo); color: var(--texto); padding: var(--space-6) var(--space-5); }
  .obras { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-5); max-width: 1080px; margin: 0 auto; }
  .obra { display: flex; flex-direction: column; gap: var(--space-3); }
  .marco { border: 12px solid var(--texto); background: var(--superficie); padding: 26px; box-shadow: 0 24px 40px -24px rgba(0,0,0,0.35); }
  .lienzo { height: 300px; position: relative; overflow: hidden; }
  .lienzo svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .noche { background: #000000; }
  .papel { background: #F4F1EA; }
  .vacio { box-sizing: border-box; border: 1.5px dashed var(--texto-suave); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-2); text-align: center; padding: var(--space-4); }
  .vacio strong { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
  .vacio span { font-size: 14px; line-height: 1.45; color: var(--texto-suave); }
  .cartela strong { display: block; font-weight: 600; font-size: 17px; }
  .cartela span { font-family: var(--font-mono); font-size: 12px; color: var(--texto-suave); }
</style>
</head>
<body>
<div id="root" class="pared" data-theme="pared">
  <div class="obras">
    <div class="obra">
      <div class="marco"><div class="lienzo noche">
        <svg viewBox="0 0 300 300" aria-hidden="true">
          <path id="luna" fill="none" stroke="#50FF05" stroke-width="12" stroke-linecap="round"></path>
          <path id="mini" fill="none" stroke="#F5F5F3" stroke-width="1.2" stroke-linejoin="round"></path>
        </svg>
      </div></div>
      <div class="cartela"><strong>STRING · La ciudad de noche</strong><span>Una sola línea y un brochazo · 2026</span></div>
    </div>
    <div class="obra">
      <div class="marco"><div class="lienzo papel">
        <svg viewBox="0 0 300 300" aria-hidden="true">
          <path d="M150 92 C206 84 236 130 224 176 C212 224 160 242 118 226 C76 210 62 162 78 126 C92 98 118 96 150 92 Z" fill="#2979FF" opacity="0.88"></path>
          <path fill="none" stroke="#1A1D24" stroke-width="1.3" stroke-linecap="round" d="M40 270 H260 M64 270 V256 H236 V270 M84 256 V92 M216 256 V92 M102 252 V96 M121 252 V96 M140 252 V96 M159 252 V96 M178 252 V96 M197 252 V96 M70 92 H230 V78 H70 Z M58 78 H242 V64 H58 Z M30 270 H40 M260 270 H270"></path>
        </svg>
      </div></div>
      <div class="cartela"><strong>Boaz · La columna</strong><span>Plano técnico y mancha azul · 2026</span></div>
    </div>
    <div class="obra">
      <div class="marco"><div class="lienzo vacio">
        <strong>Tu negocio.</strong>
        <span>Un sistema a la medida, con un arte que solo es tuyo.</span>
      </div></div>
      <div class="cartela"><strong>Próxima obra</strong><span>Técnica por definir contigo</span></div>
    </div>
  </div>
</div>
<script>
(function () {
  // Versión mínima de la ciudad para el marco de STRING.
  var pts = [[0,380],[120,380],[120,250],[230,250],[230,380],[280,380],[280,280],[330,262],[360,232],[390,262],[440,300],[440,380],[514,380],[514,172],[522,128],[530,172],[530,380],[600,380],[600,150],[622,100],[622,40],[624,40],[624,100],[646,150],[646,380],[700,380],[700,180],[730,165],[730,380],[900,380],[1060,203],[1152,296],[1248,250],[1400,380],[1490,380]];
  var s = 300 / 1490, oy = 214;
  var a0 = -1.95, a1 = a0 + Math.PI * 2 * 0.9, cx = 196, cy = 92, r = 44;
  function p(a) { return (cx + r * Math.cos(a)).toFixed(1) + ' ' + (cy + r * Math.sin(a)).toFixed(1); }
  document.getElementById('luna').setAttribute('d', 'M' + p(a0) + ' A' + r + ' ' + r + ' 0 1 1 ' + p(a1));
  document.getElementById('mini').setAttribute('d', 'M' + pts.map(function (p) { return (p[0] * s).toFixed(1) + ' ' + (oy + p[1] * s).toFixed(1); }).join(' L'));
})();
</script>
</body>
</html>
