<!-- @dsCard group="Arte" height=360 subtitle="La Ciudad de México en una línea, con la luna de un brochazo" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ciudad — vista previa</title>
<style>
  html, body { margin: 0; }
  .caja { background: var(--fondo); height: 360px; position: relative; overflow: hidden; }
  svg { position: absolute; left: 0; bottom: 0; width: 100%; height: auto; }
  .trazo { fill: none; stroke: var(--texto); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; stroke-dasharray: 6000; animation: ciudad 10s cubic-bezier(.5,.05,.3,1) .3s infinite alternate; }
  .luna { fill: none; stroke: var(--acento); stroke-width: 34; stroke-linecap: round; stroke-dasharray: 620; animation: pincel 2.4s cubic-bezier(.6,.05,.25,1) 1s both; }
  .seco { fill: none; stroke: var(--fondo); stroke-width: 2.4; stroke-dasharray: 34 22; stroke-linecap: round; }
  @keyframes ciudad { 0% { stroke-dashoffset: 6000; } 70%, 100% { stroke-dashoffset: 0; } }
  @keyframes pincel { from { stroke-dashoffset: 620; } to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { .trazo, .luna { animation: none; } }
</style>
</head>
<body>
<div id="root" class="caja">
  <svg viewBox="0 0 1490 400" aria-hidden="true">
    <path class="luna" id="luna"></path>
    <path class="seco" id="seco"></path>
    <path class="trazo" id="trazo"></path>
  </svg>
</div>
<script>
(function () {
  var P = [];
  function L(x, y) { P.push([x, y]); }
  function arc(cx, cy, r, a0, a1, n) { for (var i = 1; i <= n; i++) { var a = a0 + (a1 - a0) * i / n; P.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); } }
  var PI = Math.PI;
  L(0,380);L(40,380);L(40,330);L(90,330);L(90,380);L(120,380);L(120,250);L(135,250);
  arc(175,250,40,PI,PI*1.5,10);L(172,210);L(172,196);L(175,189);L(178,196);L(178,210);L(175,210);
  arc(175,250,40,PI*1.5,PI*2,10);L(230,250);L(230,380);L(205,380);L(205,305);
  arc(175,305,30,0,-PI,12);L(145,380);L(280,380);L(280,300);L(305,300);L(305,280);L(330,280);L(330,262);
  arc(360,262,30,PI,PI*1.5,8);L(357,232);L(357,216);L(360,207);L(363,216);L(363,232);L(360,232);
  arc(360,262,30,PI*1.5,PI*2,8);L(390,280);L(415,280);L(415,300);L(440,300);L(440,380);
  L(490,380);L(490,370);L(510,370);L(510,360);L(514,360);L(514,172);L(510,172);L(510,162);L(518,162);L(516,152);L(504,140);L(517,145);L(522,128);L(527,145);L(540,140);L(528,152);L(526,162);L(534,162);L(534,172);L(530,172);L(530,360);L(534,360);L(534,370);L(554,370);L(554,380);
  L(600,380);L(600,150);L(606,150);L(606,130);L(612,130);L(612,112);L(618,112);L(618,100);L(622,100);L(622,40);L(624,40);L(624,100);L(628,100);L(628,112);L(634,112);L(634,130);L(640,130);L(640,150);L(646,150);L(646,380);
  L(700,380);L(700,180);L(730,165);L(730,380);L(760,380);L(760,240);L(800,240);L(800,380);L(830,380);L(830,280);L(860,280);L(860,380);
  L(900,380);L(935,356);L(965,326);L(992,292);L(1015,258);L(1035,228);L(1050,210);L(1060,203);L(1072,209);L(1090,228);L(1112,254);L(1135,280);L(1152,296);L(1172,286);L(1190,272);L(1205,262);L(1218,268);L(1232,258);L(1248,250);L(1265,258);L(1282,262);L(1300,255);L(1318,266);L(1338,288);L(1360,316);L(1382,348);L(1400,380);L(1490,380);
  document.getElementById('trazo').setAttribute('d', 'M' + P.map(function (p) { return p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' L'));
  function brocha(cx, cy, r) {
    var a0 = -1.95, a1 = a0 + PI * 2 * 0.9;
    function p(a) { return (cx + r * Math.cos(a)).toFixed(1) + ' ' + (cy + r * Math.sin(a)).toFixed(1); }
    return 'M' + p(a0) + ' A' + r + ' ' + r + ' 0 1 1 ' + p(a1);
  }
  document.getElementById('luna').setAttribute('d', brocha(720, 140, 92));
  document.getElementById('seco').setAttribute('d', brocha(720, 140, 84) + ' ' + brocha(720, 140, 100));
})();
</script>
</body>
</html>
