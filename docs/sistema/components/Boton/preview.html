<!-- @dsCard group="Acciones" height=200 subtitle="Principal, secundario y enlace" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Botón — vista previa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-sans); }
  .fila { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); padding: var(--space-4); }
  .panel { background: var(--fondo); border: 1px solid var(--hairline); border-radius: var(--radius-lg); padding: var(--space-5); display: flex; flex-wrap: wrap; gap: var(--space-4); align-items: center; }
  .btn { font-family: var(--font-sans); font-size: 17px; min-height: 44px; box-sizing: border-box; padding: 12px 22px; border-radius: var(--radius-pill); text-decoration: none; display: inline-flex; align-items: center; cursor: pointer; border: 1px solid transparent; }
  .principal { background: var(--acento); color: var(--sobre-acento); }
  .secundario { background: transparent; color: var(--texto); border-color: var(--hairline); }
  .enlace { color: var(--acento); padding-left: 0; padding-right: 0; }
  .btn:focus-visible { outline: 2px solid var(--foco); outline-offset: 3px; }
</style>
</head>
<body>
<div id="root" class="fila">
  <div class="panel" data-theme="noche">
    <a class="btn principal" href="#">Solicitar diagnóstico</a>
    <a class="btn secundario" href="#">Ver cómo trabajamos</a>
    <a class="btn enlace" href="#">Ver la galería ›</a>
  </div>
  <div class="panel" data-theme="pared">
    <a class="btn principal" href="#">Solicitar diagnóstico</a>
    <a class="btn secundario" href="#">Ver cómo trabajamos</a>
    <a class="btn enlace" href="#">Ver la galería ›</a>
  </div>
</div>
<script>
  document.querySelectorAll('a[href="#"]').forEach(function (a) { a.addEventListener('click', function (e) { e.preventDefault(); }); });
</script>
</body>
</html>
